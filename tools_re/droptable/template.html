<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="영웅서기2 레어·에픽·영웅 아이템과 인장의 옵션과 드랍 몬스터. 신규 아이템 포함.">
<meta name="color-scheme" content="light dark">
<meta property="og:title" content="영웅서기2 아이템">
<meta property="og:description" content="레어 이상 아이템 · 인장 · 옵션 · 드랍 몬스터">
<title>영웅서기2 아이템</title>
<style>
:root{color-scheme:light;--bg:#f5f6f8;--surface:#fff;--ink:#20242c;--muted:#687180;--line:#e3e6ec;--hover:#f8f9fc;--rare:#996000;--epic:#287047;--hero:#9642a0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 system-ui,"Malgun Gothic",sans-serif}
main{max-width:1440px;margin:auto;padding:32px 24px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:20px}
h1{margin:0;font-size:22px;letter-spacing:-.7px}
.search{display:flex;align-items:center;gap:12px}
input{width:320px;max-width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
input::placeholder{color:var(--muted)}
input:focus-visible,button:focus-visible{outline:2px solid var(--hero);outline-offset:3px}
#count{color:var(--muted);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px;padding:0;border:0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--muted);font:inherit;font-size:13px;line-height:1.4;cursor:pointer}
.chip:hover{color:var(--ink);border-color:color-mix(in srgb,var(--ink) 30%,var(--line))}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .n{font-size:11px;font-variant-numeric:tabular-nums;opacity:.7}
.chip:focus-visible{outline:2px solid var(--hero);outline-offset:2px}
.table-wrap{overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;text-align:left}
th{background:var(--hover);padding:0;border-bottom:1px solid var(--line);white-space:nowrap}
th button{width:100%;padding:13px 16px;border:0;background:none;color:var(--muted);font:inherit;font-size:12px;font-weight:600;text-align:left;cursor:pointer;white-space:nowrap}
th button:hover{color:var(--ink)}
.arrow{margin-left:7px;color:var(--muted)}
td{padding:15px 16px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--hover)}
.name{font-weight:600;min-width:180px}
.grade,.type,.level{white-space:nowrap}
.grade span{display:inline-block;padding:2px 8px;border-radius:5px;font-size:12px;font-weight:600;background:color-mix(in srgb,currentColor 9%,transparent)}
.g1{color:var(--rare)}.g2{color:var(--epic)}.g3{color:var(--hero)}
.na{color:var(--muted)}
.arm{display:inline-block;margin-left:6px;padding:0 6px;border:1px solid var(--line);border-radius:5px;font-size:11px;font-weight:600;line-height:18px;color:var(--muted)}
.arm.heavy{border-color:transparent;background:color-mix(in srgb,var(--ink) 12%,transparent);color:var(--ink)}
.level{font-variant-numeric:tabular-nums}
.options{min-width:230px;max-width:330px}
.drops{min-width:280px;max-width:480px}
.drop-group+.drop-group{margin-top:8px}
.mode{font-size:11px;color:var(--muted);display:block;margin-bottom:2px}
.empty{text-align:center;color:var(--muted);padding:48px}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#14171c;--surface:#1c2027;--ink:#e6e9ee;--muted:#9ca6b5;--line:#303640;--hover:#222730;--rare:#e0b75b;--epic:#7ac59a;--hero:#d796df}}
@media(max-width:680px){main{padding:22px 12px 32px}header{align-items:flex-start;flex-direction:column;gap:14px}h1{font-size:20px}.search{width:100%}input{flex:1;width:auto;min-width:0}td{padding:12px}th button{padding:12px}.name{min-width:160px}}
</style>
</head>
<body>
<main>
<header>
<h1>영웅서기2 아이템</h1>
<div class="search"><input id="search" type="search" aria-label="아이템 검색" placeholder="아이템, 옵션, 몬스터 검색" autocomplete="off"><span id="count" role="status" aria-live="polite"></span></div>
</header>
<div class="filters" id="filters" role="group" aria-label="아이템 종류"></div>
<div class="table-wrap">
<table aria-label="레어 이상 아이템과 인장">
<thead><tr>
<th scope="col" aria-sort="ascending"><button type="button" data-sort="n">아이템<span class="arrow" aria-hidden="true">↑</span></button></th>
<th scope="col"><button type="button" data-sort="g">등급<span class="arrow" aria-hidden="true">↕</span></button></th>
<th scope="col"><button type="button" data-sort="tk">종류<span class="arrow" aria-hidden="true">↕</span></button></th>
<th scope="col"><button type="button" data-sort="lv">레벨<span class="arrow" aria-hidden="true">↕</span></button></th>
<th scope="col"><button type="button" data-sort="options">옵션<span class="arrow" aria-hidden="true">↕</span></button></th>
<th scope="col"><button type="button" data-sort="drops">드랍 몬스터<span class="arrow" aria-hidden="true">↕</span></button></th>
</tr></thead>
<tbody id="rows"></tbody>
</table>
</div>
</main>
<script id="data" type="application/json">{{DATA}}</script>
<script>
const data = JSON.parse(document.getElementById('data').textContent);
const grades = ['', '레어', '에픽', '영웅'];
const modes = ['노말', '하드코어', '헬', '헬 · 난이도 NORMAL 이상', '가디언', '가디언 · 난이도 NORMAL 이상'];
const collator = new Intl.Collator('ko', { numeric: true });
const escapeHtml = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const normalize = value => value.normalize('NFKC').toLocaleLowerCase('ko').replace(/\s+/g, '');
const statKey = value => normalize(value).replaceAll('+', '');
const items = data.items.map(item => {
  const options = [...item.st, ...item.op];
  if (item.set) options.push(item.set);
  const effects = (item.desc || '').split(',').map(text => text.trim()).filter(text => text && !options.some(option => statKey(option) === statKey(text)));
  options.push(...effects);
  const groups = new Map();
  item.d.forEach(([mobIndex, modeIndexes]) => {
    const mode = modeIndexes.map(index => modes[index]).join(' · ');
    if (!groups.has(mode)) groups.set(mode, new Set());
    const mob = data.mobs[mobIndex];
    groups.get(mode).add(mob.n + (mob.placed ? '' : ' (출현 미확인)'));
  });
  const dropGroups = [...groups].map(([mode, names]) => ({mode, names: [...names].sort(collator.compare)}));
  const drops = dropGroups.map(group => `${group.mode} ${group.names.join(', ')}`).join(' ');
  const source = item.src.join(' · ');
  const arm = item.arm || '';
  const wear = (item.w || []).map(job => job.endsWith('*') ? `${job.slice(0, -1)}(중장비 습득 시)` : job).join(' · ');
  const seal = item.t >= 13 && item.t <= 17;
  return {...item, arm, wear, seal, tk: arm ? `${item.tn} ${arm}` : item.tn, options: options.join(' · '), optionLines: options, drops, dropGroups, source,
    searchText: normalize([item.n, grades[item.g] || '', item.tn, arm, item.lv, options.join(' '), drops, source].join(' '))};
});
const search = document.getElementById('search');
const rows = document.getElementById('rows');
const count = document.getElementById('count');
const filterBox = document.getElementById('filters');
const kinds = [
  {key: 'all', label: '전체', test: () => true},
  {key: 'acc', label: '장신구', test: item => item.t === 11 || item.t === 12},
  {key: 'heavy', label: '중갑', test: item => item.arm === '중갑'},
  {key: 'light', label: '경갑', test: item => item.arm === '경갑'},
  {key: 'sword', label: '도검', test: item => item.t === 2},
  {key: 'blunt', label: '둔기', test: item => item.t === 4},
  {key: 'large', label: '대형무기', title: '대검 · 도끼', test: item => item.t === 0 || item.t === 1},
  {key: 'dagger', label: '단검', test: item => item.t === 3},
  {key: 'seal', label: '인장', title: '무기에 능력치를 더하는 인장 — 「인장」 +5~+10 · 상급 +15~+20', test: item => item.seal},
];
const picked = new Set();
filterBox.innerHTML = kinds.map(kind => `<button type="button" class="chip" data-kind="${kind.key}" aria-pressed="${kind.key === 'all'}"${kind.title ? ` title="${escapeHtml(kind.title)}"` : ''}>${escapeHtml(kind.label)}<span class="n">${items.filter(kind.test).length}</span></button>`).join('');
filterBox.addEventListener('click', event => {
  const chip = event.target.closest('.chip');
  if (!chip) return;
  const key = chip.dataset.kind;
  if (key === 'all') picked.clear();
  else if (picked.has(key)) picked.delete(key);
  else picked.add(key);
  filterBox.querySelectorAll('.chip').forEach(other => other.setAttribute('aria-pressed', String(other.dataset.kind === 'all' ? picked.size === 0 : picked.has(other.dataset.kind))));
  render();
});
let sortKey = 'n';
let sortDirection = 1;
function render() {
  const terms = search.value.normalize('NFKC').toLocaleLowerCase('ko').trim().split(/\s+/).filter(Boolean);
  const tests = kinds.filter(kind => picked.has(kind.key)).map(kind => kind.test);
  const filtered = items.filter(item => (tests.length === 0 || tests.some(test => test(item))) && terms.every(term => item.searchText.includes(normalize(term))));
  filtered.sort((a, b) => {
    const comparison = typeof a[sortKey] === 'number' ? a[sortKey] - b[sortKey] : collator.compare(a[sortKey], b[sortKey]);
    return comparison * sortDirection || collator.compare(a.n, b.n);
  });
  count.textContent = `${filtered.length} / ${items.length}`;
  rows.innerHTML = filtered.length ? filtered.map(item => {
    const drops = item.dropGroups.length ? item.dropGroups.map(group => `<div class="drop-group"><span class="mode">${escapeHtml(group.mode)}</span>${escapeHtml(group.names.join(', '))}</div>`).join('') : escapeHtml(item.source ? `드랍 없음 · ${item.source}` : '드랍 없음');
    return `<tr><td class="name">${escapeHtml(item.n)}</td><td class="grade">${item.seal ? '<span class="na">—</span>' : `<span class="g${item.g}">${grades[item.g]}</span>`}</td><td class="type">${escapeHtml(item.tn)}${item.arm ? `<span class="arm${item.arm === '중갑' ? ' heavy' : ''}"${item.wear ? ` title="착용: ${escapeHtml(item.wear)}"` : ''}>${escapeHtml(item.arm)}</span>` : ''}</td><td class="level">${item.seal ? '<span class="na">—</span>' : item.lv}</td><td class="options">${item.optionLines.map(escapeHtml).join('<br>') || '—'}</td><td class="drops">${drops}</td></tr>`;
  }).join('') : '<tr><td class="empty" colspan="6">검색 결과가 없습니다.</td></tr>';
}
document.querySelectorAll('[data-sort]').forEach(button => {
  button.addEventListener('click', () => {
    if (sortKey === button.dataset.sort) sortDirection *= -1;
    else { sortKey = button.dataset.sort; sortDirection = 1; }
    document.querySelectorAll('[data-sort]').forEach(other => {
      const active = other === button;
      other.parentElement.setAttribute('aria-sort', active ? (sortDirection === 1 ? 'ascending' : 'descending') : 'none');
      other.querySelector('.arrow').textContent = active ? (sortDirection === 1 ? '↑' : '↓') : '↕';
    });
    render();
  });
});
search.addEventListener('input', render);
render();
</script>
</body>
</html>
